services:
  api:
    build:
      context: .
      target: app
    image: postboard-api
    container_name: postboard-api-1
    env_file:
      - .env
    restart: always
    volumes:
      - ./app:/app/app
    ports:
      - ${UVICORN_PORT}:${UVICORN_PORT}
    depends_on:
      postgres:
        condition: service_healthy
  test:
    build:
      context: .
      target: test
    image: postboard-api-test
    container_name: postboard-api-test-1
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - .env.test
    volumes:
      - ./coverage_report:/app/coverage_report
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:13.5
    container_name: postboard_postgres
    environment:
        - POSTGRES_USER=postboard
        - POSTGRES_PASSWORD=postboard
        - POSTGRES_DB=postboard
    volumes:
        - postgres-data:/var/lib/postgresql/data
    ports:
        - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
